name: Render Backend 24/7 Keep-Alive

on:
  schedule:
    # Runs every 10 minutes (Render sleeps after 15 mins of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping StreakUp Render Cloud API
        run: |
          echo "Pinging StreakUp Render API to keep container warm..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://streakup-backend-02pl.onrender.com/api/v1/health || echo "FAILED")
          echo "Render Health Check HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ StreakUp backend is awake and healthy!"
          else
            echo "⚠️ Backend responded with $HTTP_STATUS or timed out, will re-ping in next cycle."
          fi
