name: EAS Auto Update on Push

on:
  push:
    branches:
      - main
    paths:
      - 'streakup-mobile/**'

jobs:
  update:
    name: EAS Over-The-Air Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: streakup-mobile/package.json

      - name: 📦 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Install dependencies
        working-directory: streakup-mobile
        run: npm install --legacy-peer-deps

      - name: 🚀 Publish EAS Over-The-Air Update
        working-directory: streakup-mobile
        run: eas update --auto
