name: EAS Auto Update on Push

on:
  push:
    branches:
      - main
    paths:
      - 'streakup-mobile/**'
      - '.github/workflows/**'

jobs:
  update:
    name: EAS Over-The-Air Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup EAS CLI
        run: npm install -g eas-cli

      - name: 📥 Install dependencies
        working-directory: streakup-mobile
        run: npm install --legacy-peer-deps

      - name: 🚀 Publish EAS Over-The-Air Update
        working-directory: streakup-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli update --branch preview --message "Automated GitHub Actions live update" --non-interactive
